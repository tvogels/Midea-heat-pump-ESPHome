name: CI

on:
  push:
    branches: [site-zwwg]
  pull_request:
  workflow_dispatch:

env:
  ESPHOME_VERSION: "2026.6.5"
  YAMLLINT_VERSION: "1.38.0"
  LLVM_VERSION: "23.1.3"  # clang-format and clang-tidy

jobs:
  helpers:
    name: C++ helper tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: g++ -std=c++17 -Wall -Wextra -Werror -I tests/stubs -I include tests/test_helpers.cpp -o test_helpers
      - run: ./test_helpers

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - name: yamllint
        run: uvx --from "yamllint==$YAMLLINT_VERSION" yamllint --strict .
      - name: clang-format
        run: uvx --from "clang-format==$LLVM_VERSION" clang-format --dry-run -Werror $(git ls-files '*.h' '*.cpp')
      - name: clang-tidy
        run: |
          uvx --from "clang-tidy==$LLVM_VERSION" clang-tidy --quiet tests/test_helpers.cpp \
            -- -std=c++17 -I tests/stubs -I include

  firmware:
    name: Firmware (${{ matrix.variant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [heatpump, heatpump-lease]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2  # no floating major tag upstream
      - uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: platformio-${{ env.ESPHOME_VERSION }}
      - name: Use dummy secrets
        run: cp tests/secrets.ci.yaml secrets.yaml
      - name: Select config
        run: |
          if [ "${{ matrix.variant }}" = heatpump-lease ]; then
            # Same as heatpump.yaml with the opt-in lease package enabled.
            sed 's|^  # \(- !include packages/t1s-lease.yaml\)$|  \1|' heatpump.yaml > heatpump-lease.tmp.yaml
            grep -q '^  - !include packages/t1s-lease.yaml$' heatpump-lease.tmp.yaml
            echo "CONFIG=heatpump-lease.tmp.yaml" >> "$GITHUB_ENV"
          else
            echo "CONFIG=heatpump.yaml" >> "$GITHUB_ENV"
          fi
      - name: Validate
        run: uvx --from "esphome==$ESPHOME_VERSION" esphome config "$CONFIG" > /dev/null
      - name: Compile
        run: uvx --from "esphome==$ESPHOME_VERSION" esphome compile "$CONFIG"
