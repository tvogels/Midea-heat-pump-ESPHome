# ESPHome config for the Airwell Wellea M HT R290 monobloc at zwwg,
# read and controlled over Modbus RTU by a LilyGO T-CAN485.
#
#   uvx esphome==2026.6.5 run heatpump.yaml --device heatpump.local
#
# Each package is a plain ESPHome config fragment; ESPHome merges them.
# See README.md for the layout and docs/registers.md for the register map.

packages:
  - !include packages/hardware.yaml
  - !include packages/controls.yaml
  - !include packages/telemetry.yaml
  - !include packages/energy.yaml
  - !include packages/status.yaml
  - !include packages/installer-settings.yaml
  # Opt-in: supervised T1S lease for an external supervisor (docs/t1s-lease.md).
  # - !include packages/t1s-lease.yaml
