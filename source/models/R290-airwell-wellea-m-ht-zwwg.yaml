# -----------------------------------------------------------------------------
# MODIFY — UFH safety caps for THIS install
# -----------------------------------------------------------------------------
# SAFETY: Zone 1 underfloor heating, max water setpoint 40 °C.
# Cement screed integrity degrades above ~45–50 °C and floor coverings
# (laminate, vinyl, parquet glue) above ~35–40 °C. 40 °C is the highest
# value comfortable for a UFH-only install on this house. Do NOT raise
# without per-zone risk review (verify floor covering, screed type, pipe
# spacing, max permissible surface T per BS EN 1264-2 / NEN 1068).
# -----------------------------------------------------------------------------
modify:
  binary_sensor:
    # Pump_O is removed (not installed); base "Heat pump running" lambda read it.
    # Use the internal circulation pump Pump_I (reg 129 BIT3) instead.
    - id: "${devicename}_heat_pump_running"
      lambda: |-
        int fan_speed = id(${devicename}_fan_speed).state;
        int compressor_frequency = id(${devicename}_compressor_operating_frequency).state;
        bool internal_water_pump_on = id(${devicename}_load_output_internal_circulation_pump_pump_i).state;
        return fan_speed > 0 || compressor_frequency > 0 || internal_water_pump_on;
    # Reg 128 BIT6/BIT7 per Modbus doc are the room-thermostat HT/CL on/off
    # inputs (base labels them "Master Mode Mirror Heat/Cool"). Same ids kept.
    - id: "${devicename}_status_bit_1_master_mode_heat"
      name: "Room Thermostat Heat Demand (HT)"
    - id: "${devicename}_status_bit_1_master_mode_cool"
      name: "Room Thermostat Cool Demand (CL)"
  number:
    - id: "${devicename}_set_water_temperature_t1s_zone_1"
      max_value: 40
    # Zone-1 custom climate-curve heating setpoints — same UFH cap.
    - id: "${devicename}_t1seth1"
      max_value: 40
    - id: "${devicename}_t1seth2"
      max_value: 40
    # Reg 271 t_DELAY PUMP: upstream 10.1 relabelled the unit min -> hr, but the
    # Midea R290 service manual (7.3.18.1) specifies minutes (range 2-20, step
    # 0.5, raw x2); the 120L Modbus doc gives no usable unit. Restore minutes.
    - id: "${devicename}_t_delay_pump"
      unit_of_measurement: min
