---
# ============================================================================
# Wellea M HT — site overlay for Zoeterwoudseweg (zwwg)
# ----------------------------------------------------------------------------
# Layered on top of the public R290-airwell-wellea-m-ht.yaml model overlay
# (which itself layers on R290-generic.yaml + the Mosibi base).
#
# This file is install-specific. It captures:
#  * which entities to remove because the corresponding hardware feature is
#    not physically present on this install;
#  * a UFH safety cap on the Z1 setpoint and on the manual-curve heating
#    setpoints, because this house heats via underfloor pipes embedded in a
#    cement screed that cracks well above ~45 °C.
#
# Install fingerprint (see wiki/projects/airwell-modbus/install-profile.md
# for the canonical, fully-cited list):
#  * single zone (Zone 1 only), no Zone 2 hardware wired;
#  * underfloor heating (FLH emitter), no radiators, no fan-coil units;
#  * no IBH, no TBH, no AHS, no SETHEATER (no electric heaters of any kind);
#  * no buffer tank (no Tbt1/Tbt2 sensors);
#  * single-PHE refrigerant circuit (no second plate heat exchanger,
#    no T9i / T9o, no EXV2 / EXV3);
#  * single-fan ODU (no Fan2);
#  * no solar thermal;
#  * dry-contact room thermostat wired (gates reg 0 BIT 1, NOT analog Ta).
#
# This file is NEVER pushed to the upstream Mosibi repository — it lives
# only on the local `site-zwwg` git branch.
# ============================================================================

parent: R290-airwell-wellea-m-ht.yaml

