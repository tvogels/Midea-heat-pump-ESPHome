  - platform: modbus_controller
    modbus_controller_id: "heatpump"
    name: "T4H2"
    id: "heatpump_t4h2"
    icon: mdi:temperature-celsius
    register_type: holding
    address: 268
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: "temperature"
    entity_category: config
    min_value: -25
    max_value: 35

  - platform: modbus_controller
    modbus_controller_id: "heatpump"
    name: "t_T4 FRESH_H"
    id: "heatpump_t_t4_fresh_h"
    icon: mdi:clock-check-outline
    register_type: holding
    address: 270
    value_type: U_WORD
    unit_of_measurement: hr
    entity_category: config
    min_value: 0.5
    max_value: 6.0
    step: 0.5
    mode: slider
    lambda: |-
      // Update the global var unmasked_value_register_270
      id(unmasked_value_register_270) = x;
      id(unmasked_value_register_270_valid) = true;  // Shadow now holds a real value read from the heatpump

      float value_floats[2];
      uint16_t value = x;

      // Extracting the high byte (Cooling) and storing it as a float
      value_floats[0] = (float)(value >> 8) * 0.5;

      // Extracting the low byte (Heating) and storing it as a float
      value_floats[1] = (float)(value & 0x00FF) * 0.5;

      // ESP_LOGI("","t_T4 FRESH_H is %f", value_floats[1]);
      // ESP_LOGI("","t_T4 FRESH_C is %f", value_floats[0]);

      return value_floats[1];
    write_lambda: |-
      if (!id(unmasked_value_register_270_valid)) {
        ESP_LOGW("packed_register", "Refusing write: unmasked_value_register_270 not yet read from heatpump, would clobber other bits");
        return {};
      }
      uint16_t value = id(unmasked_value_register_270); // The original unmasked value
      float input = x * 2.0;                            // Multiply x (the input from the slider) by 2

      // Multiply the input from the slider (x) by by
      // and convert to uint8_t
      uint8_t input_byte = static_cast<uint8_t>(x * 2.0);

      value &= 0xFF00;      // Clear the lower byte of the value
      value |= input_byte;  // Update the lower byte with the new byte value

      // ESP_LOGI("main", "Original value: %d", id(unmasked_value_register_270));
      // ESP_LOGI("main", "New value: %d", value);

      esphome::modbus_controller::ModbusCommandItem set_payload_command = esphome::modbus_controller::ModbusCommandItem::create_write_single_command(heatpump, 0x10e, value);
      heatpump->queue_command(set_payload_command);
      id(unmasked_value_register_270) = value;  // Optimistic shadow update so a second write before the next poll keeps this change

      return {};

  - platform: modbus_controller
    modbus_controller_id: "heatpump"
    name: "t_T4 FRESH_C"
    id: "heatpump_t_t4_fresh_c"
    icon: mdi:clock-check-outline
    register_type: holding
    address: 270
    value_type: U_WORD
    unit_of_measurement: hr
    entity_category: config
    min_value: 0.5
    max_value: 6.0
    step: 0.5
    mode: slider
    lambda: |-
      // Update the global var unmasked_value_register_270
      id(unmasked_value_register_270) = x;
      id(unmasked_value_register_270_valid) = true;  // Shadow now holds a real value read from the heatpump

      float value_floats[2];
      uint16_t value = x;

      // Extracting the high byte (Cooling) and storing it as a float
      value_floats[0] = (float)(value >> 8) * 0.5;

      // Extracting the low byte (Heating) and storing it as a float
      value_floats[1] = (float)(value & 0x00FF) * 0.5;

      return value_floats[0];
    write_lambda: |-
      if (!id(unmasked_value_register_270_valid)) {
        ESP_LOGW("packed_register", "Refusing write: unmasked_value_register_270 not yet read from heatpump, would clobber other bits");
        return {};
      }
      uint16_t value = id(unmasked_value_register_270); // The original unmasked value
      float input = x * 2.0;                            // Multiply x (the input from the slider) by 2

      // Multiply the input from the slider (x) by by
      // and convert to uint8_t
      uint8_t input_byte = static_cast<uint8_t>(x * 2.0);

      value &= 0x00FF;             // Clear the upper byte of the value
      value |= (input_byte << 8);  // Update the upper byte with the new byte value

      esphome::modbus_controller::ModbusCommandItem set_payload_command = esphome::modbus_controller::ModbusCommandItem::create_write_single_command(heatpump, 0x10e, value);
      heatpump->queue_command(set_payload_command);
      id(unmasked_value_register_270) = value;  // Optimistic shadow update so a second write before the next poll keeps this change

      return {};

