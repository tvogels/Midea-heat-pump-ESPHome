sensor:
  # Regs 200-208 are read-only (FC03). From 209 on: FC03/06/16.
  - platform: modbus_controller
    modbus_controller_id: "heatpump"
    name: "Temperature Upper Limit Of T1S Cooling Zone 1"
    id: "heatpump_temperature_upper_limit_of_t1s_cooling_zone_1"
    icon: mdi:temperature-celsius
    register_type: holding
    address: 201
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: "temperature"
    state_class: "measurement"
    bitmask: 0x00FF

  - platform: modbus_controller
    modbus_controller_id: "heatpump"
    name: "Temperature Lower Limit Of T1S Cooling Zone 1"
