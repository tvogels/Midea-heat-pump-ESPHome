  - platform: modbus_controller
    modbus_controller_id: "heatpump"
    name: "t_T4 FRESH_H"
    id: "heatpump_t_t4_fresh_h"
    icon: mdi:clock-check-outline
    register_type: holding
    address: 270
    value_type: U_WORD
    unit_of_measurement: hr
    entity_category: config
    min_value: 0.5
    max_value: 6.0
    step: 0.5
    mode: slider
    lambda: |-
      hp::capture(id(reg270), id(reg270_valid), x);
      return ((uint16_t) x & 0x00FF) * 0.5;  // heating: low byte
    write_lambda: |-
      hp::write_packed(heatpump, 270, id(reg270), id(reg270_valid), 0x00FF, (uint8_t) (x * 2.0));
      return {};

  - platform: modbus_controller
    modbus_controller_id: "heatpump"
    name: "t_T4 FRESH_C"
    id: "heatpump_t_t4_fresh_c"
    icon: mdi:clock-check-outline
    register_type: holding
    address: 270
    value_type: U_WORD
    unit_of_measurement: hr
    entity_category: config
    min_value: 0.5
    max_value: 6.0
    step: 0.5
    mode: slider
    lambda: |-
      hp::capture(id(reg270), id(reg270_valid), x);
      return ((uint16_t) x >> 8) * 0.5;  // cooling: high byte
    write_lambda: |-
      hp::write_packed(heatpump, 270, id(reg270), id(reg270_valid), 0xFF00, (uint8_t) (x * 2.0));
      return {};

  # Reg 271 t_DELAY PUMP: unit is minutes per the Midea R290 service manual 7.3.18.1
  # (range 2-20, step 0.5, raw x2). Upstream 10.1 relabelled it hr.
  - platform: modbus_controller
