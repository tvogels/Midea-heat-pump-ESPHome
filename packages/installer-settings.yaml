switch:
  - platform: template
    name: "Parameter Setting 1 Heating And Cooling First Or Water First"
    id: "heatpump_parameter_setting_1_heating_and_cooling_first_or_water_first"
    icon: mdi:eye
    entity_category: config
    restore_mode: DISABLED
    optimistic: true
    lambda: "return (id(reg210) & 0x1) == 0x1;"
    on_turn_on:
      - lambda: hp::write_packed(heatpump, 210, id(reg210), id(reg210_valid), 0x1, true);
    on_turn_off:
