# Energy counters, real-time capacity/power and COP (regs 143-186).

sensor:
  # Regs 143-144 (U_DWORD). R290: actual value x100, kWh.
  - platform: modbus_controller
    modbus_controller_id: "heatpump"
    name: "Electricity Consumption"
    id: "heatpump_electricity_consumption"
    icon: mdi:lightning-bolt-outline
    register_type: holding
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total_increasing
    address: 143
    value_type: U_DWORD
    filters:
      - lambda: return x * 0.01;
    accuracy_decimals: 2

  # Regs 145-146 (U_DWORD). R290: actual value x100, kWh.
  - platform: modbus_controller
    modbus_controller_id: "heatpump"
    name: "Power Output"
    id: "heatpump_power_output"
    icon: mdi:lightning-bolt-outline
    register_type: holding
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total_increasing
    address: 145
    value_type: U_DWORD
    filters:
      - lambda: return x * 0.01;
    accuracy_decimals: 2

  - platform: template
    name: "Coefficient of Performance"
    id: "heatpump_coefficient_of_performance"
    icon: mdi:copyleft
    accuracy_decimals: 2
    unit_of_measurement: "COP"
    lambda: |-
      // Verify that electricity_consumption is <> 0 to avoid division by 0 error
      if (id(heatpump_electricity_consumption).state != 0) {
        return id(heatpump_power_output).state / id(heatpump_electricity_consumption).state;
      } else {
        return NAN;
      }

  # Regs 140/148/151/183/186 are signed (they read 652-654 during defrost as U_WORD).
  # Renamed in PR #5 so old and new values never share an InfluxDB series (docs/entity-migration.csv).
  - id: "heatpump_heating_capacity_signed"
    platform: modbus_controller
    modbus_controller_id: "heatpump"
    name: "Heating Capacity (signed)"
    icon: mdi:lightning-bolt
    register_type: holding
    address: 148
    value_type: S_WORD
    unit_of_measurement: "kW"
    accuracy_decimals: 2
    filters:
      - lambda: return x * 0.01;

  - platform: modbus_controller
