# Status bits, load outputs, faults, versions and product code (regs 101, 124-131, 187-190, 198, 200, 612-613).

sensor:
  # Regs 124-127: fault codes, decoded by the text sensors below.
  - platform: modbus_controller
    modbus_controller_id: "heatpump"
    name: "Current Fault"
    id: "heatpump_current_fault"
    icon: mdi:alert-circle
    register_type: holding
    entity_category: diagnostic
    address: 124
    value_type: U_WORD

  - platform: modbus_controller
    modbus_controller_id: "heatpump"
    name: "Fault 1"
    id: "heatpump_fault_1"
    icon: mdi:alert-circle
    register_type: holding
    entity_category: diagnostic
    address: 125
    value_type: U_WORD

  - platform: modbus_controller
    modbus_controller_id: "heatpump"
    name: "Fault 2"
    id: "heatpump_fault_2"
    icon: mdi:alert-circle
    register_type: holding
    entity_category: diagnostic
    address: 126
    value_type: U_WORD

  - platform: modbus_controller
    modbus_controller_id: "heatpump"
    name: "Fault 3"
    id: "heatpump_fault_3"
    icon: mdi:alert-circle
    register_type: holding
    entity_category: diagnostic
    address: 127
    value_type: U_WORD

  - platform: modbus_controller
    modbus_controller_id: "heatpump"
    name: "Software Version"
    id: "heatpump_software_version"
    icon: mdi:information
    register_type: holding
    address: 130
    value_type: U_WORD

  - platform: modbus_controller
    modbus_controller_id: "heatpump"
    name: "Wired Controller Version Number"
    id: "heatpump_wired_controller_version_number"
    icon: mdi:information
    register_type: holding
    address: 131
    value_type: U_WORD

  - platform: template
    name: "Active State Map"
    id: "heatpump_active_state_map"
    unit_of_measurement: ""
    accuracy_decimals: 0
    lambda: return hp::active_state_code(id(heatpump_active_state).state);

  # Reg 188: extended fault list (companion to reg 124).
  - platform: modbus_controller
    modbus_controller_id: "heatpump"
    name: "Error Code (extended)"
    id: "heatpump_error_code_extended"
    icon: mdi:alert-circle
    register_type: holding
    address: 188
    value_type: U_WORD
    entity_category: diagnostic

  # Regs 612/613: capability bitmasks, exposed raw.
  - platform: modbus_controller
    modbus_controller_id: "heatpump"
    name: "Capability Bitmask 612"
    id: "heatpump_capability_bitmask_612"
    icon: mdi:format-list-bulleted-type
    register_type: holding
    address: 612
    value_type: U_WORD
    entity_category: diagnostic

  - platform: modbus_controller
    modbus_controller_id: "heatpump"
    name: "Capability Bitmask 613"
    id: "heatpump_capability_bitmask_613"
    icon: mdi:format-list-bulleted-type
    register_type: holding
    address: 613
    value_type: U_WORD
    entity_category: diagnostic

binary_sensor:
  # Reg 128: status bits 1.
  - platform: modbus_controller
    modbus_controller_id: "heatpump"
    name: "Status BIT 1 Defrosting"
    id: "heatpump_status_bit_1_defrosting"
    icon: mdi:eye
    register_type: holding
    address: 128
    bitmask: 0x2

  - platform: modbus_controller
    modbus_controller_id: "heatpump"
    name: "Status BIT 1 Anti Freezing"
    id: "heatpump_status_bit_1_anti_freezing"
    icon: mdi:eye
    register_type: holding
    address: 128
    bitmask: 0x4

  - platform: modbus_controller
    modbus_controller_id: "heatpump"
    name: "Status BIT 1 Oil Return"
    id: "heatpump_status_bit_1_oil_return"
    icon: mdi:eye
    register_type: holding
    address: 128
    bitmask: 0x8

  - platform: modbus_controller
    modbus_controller_id: "heatpump"
    name: "Status BIT 1 Remote On-Off"
    id: "heatpump_status_bit_1_remote_on_off"
    icon: mdi:eye
    register_type: holding
    address: 128
    bitmask: 0x10

  - platform: modbus_controller
    modbus_controller_id: "heatpump"
    name: "Status BIT 1 Outdoor Unit Test Mode Mark"
    id: "heatpump_status_bit_1_outdoor_unit_test_mode_mark"
    icon: mdi:eye
    register_type: holding
    address: 128
    bitmask: 0x20

  # Reg 128 bits 6/7: V.E documents these as the room thermostat HT/CL inputs.
  # (An earlier empirical note read them as master-mode mirrors; the ids still say so.)
  - platform: modbus_controller
    modbus_controller_id: "heatpump"
    name: "Room Thermostat Heat Demand (HT)"
    id: "heatpump_status_bit_1_master_mode_heat"
    icon: mdi:radiator
    register_type: holding
    address: 128
    bitmask: 0x40
    entity_category: diagnostic

  - platform: modbus_controller
    modbus_controller_id: "heatpump"
    name: "Room Thermostat Cool Demand (CL)"
    id: "heatpump_status_bit_1_master_mode_cool"
    icon: mdi:snowflake
    register_type: holding
    address: 128
    bitmask: 0x80
    entity_category: diagnostic

  - platform: modbus_controller
    modbus_controller_id: "heatpump"
    name: "Status BIT 1 Anti Freezing Operation For Water Tank"
    id: "heatpump_status_bit_1_anti_freezing_operation_for_water_tank"
    icon: mdi:eye
    register_type: holding
    address: 128
    bitmask: 0x200

  - platform: modbus_controller
    modbus_controller_id: "heatpump"
    name: "Status BIT 1 SG"
    id: "heatpump_status_bit_1_sg"
    icon: mdi:eye
    register_type: holding
    address: 128
    bitmask: 0x400

  - platform: modbus_controller
    modbus_controller_id: "heatpump"
    name: "Status BIT 1 EUV"
    id: "heatpump_status_bit_1_euv"
    icon: mdi:eye
    register_type: holding
    address: 128
    bitmask: 0x800

  - platform: modbus_controller
    modbus_controller_id: "heatpump"
    name: "Status BIT 1 Request Serial Number Code"
    id: "heatpump_status_bit_1_request_serial_number_code"
    icon: mdi:eye
    register_type: holding
    address: 128
    bitmask: 0x2000

  - platform: modbus_controller
    modbus_controller_id: "heatpump"
    name: "Status BIT 1 Request Software Version"
    id: "heatpump_status_bit_1_request_software_version"
    icon: mdi:eye
    register_type: holding
    address: 128
    bitmask: 0x4000

  - platform: modbus_controller
    modbus_controller_id: "heatpump"
    name: "Status BIT 1 Request Operation Parameter"
    id: "heatpump_status_bit_1_request_operation_parameter"
    icon: mdi:eye
    register_type: holding
    address: 128
    bitmask: 0x8000

  # Reg 129: load outputs.
  - platform: modbus_controller
    modbus_controller_id: "heatpump"
    name: "Load Output Internal Circulation Pump PUMP_I"
    id: "heatpump_load_output_internal_circulation_pump_pump_i"
    icon: mdi:pump
    register_type: holding
    address: 129
    bitmask: 0x8

  - platform: modbus_controller
    modbus_controller_id: "heatpump"
    name: "Load Output SV 1"
    id: "heatpump_load_output_sv1"
    icon: mdi:eye
    register_type: holding
    address: 129
    bitmask: 0x10

  - platform: modbus_controller
    modbus_controller_id: "heatpump"
    name: "Load Output SV 2"
    id: "heatpump_load_output_sv2"
    icon: mdi:head-question-outline
    register_type: holding
    address: 129
    bitmask: 0x20

  - id: "heatpump_load_output_heat4"
    platform: modbus_controller
    modbus_controller_id: "heatpump"
    name: "Load Output HEAT4 (Crankcase-Chassis Heater)"
    icon: mdi:eye
    register_type: holding
    address: 129
    bitmask: 0x400

  - platform: modbus_controller
    modbus_controller_id: "heatpump"
    name: "Load Output ALARM"
    id: "heatpump_load_output_alarm"
    icon: mdi:eye
    register_type: holding
    entity_category: diagnostic
    address: 129
    bitmask: 0x1000

  - platform: modbus_controller
    modbus_controller_id: "heatpump"
    name: "Load Output RUN"
    id: "heatpump_load_output_run"
    icon: mdi:eye
    register_type: holding
    address: 129
    bitmask: 0x2000

  - platform: modbus_controller
    modbus_controller_id: "heatpump"
    name: "Load Output DEFROST"
    id: "heatpump_load_output_defrost"
    icon: mdi:eye
    register_type: holding
    address: 129
    bitmask: 0x8000

  # Reg 198: status bits.
  - platform: modbus_controller
    modbus_controller_id: "heatpump"
    name: "Status T1B Enabled"
    id: "heatpump_status_t1b_enabled"
    register_type: holding
    address: 198
    bitmask: 0x1000
    entity_category: diagnostic

  - platform: modbus_controller
    modbus_controller_id: "heatpump"
    name: "Status T1 Enabled"
    id: "heatpump_status_t1_enabled"
    register_type: holding
    address: 198
    bitmask: 0x0200
    entity_category: diagnostic

  - platform: modbus_controller
    modbus_controller_id: "heatpump"
    name: "Status Energy Metering Enabled"
    id: "heatpump_status_energy_metering_enabled"
    register_type: holding
    address: 198
    bitmask: 0x0100
    entity_category: diagnostic

  - platform: modbus_controller
    modbus_controller_id: "heatpump"
    name: "Status DHW Operation"
    id: "heatpump_status_dhw_operation"
    register_type: holding
    address: 198
    bitmask: 0x0020
    entity_category: diagnostic

  - platform: modbus_controller
    modbus_controller_id: "heatpump"
    name: "Status Heating Operation"
    id: "heatpump_status_heating_operation"
    register_type: holding
    address: 198
    bitmask: 0x0010
    entity_category: diagnostic

  - platform: modbus_controller
    modbus_controller_id: "heatpump"
    name: "Status Cooling Operation"
    id: "heatpump_status_cooling_operation"
    register_type: holding
    address: 198
    bitmask: 0x0008
    entity_category: diagnostic

  # Reg 189 bit 8: 0 = 1 °C resolution, 1 = 0.1 °C (value x10). Affects registers
  # marked (1)/(2) in V.E; the scaling in this config assumes 0.
  - platform: modbus_controller
    modbus_controller_id: "heatpump"
    name: "Status BIT 2 Temperature Precision (0=1°C, 1=0.1°C)"
    id: "heatpump_status_bit_2_temperature_precision"
    icon: mdi:decimal-comma
    register_type: holding
    address: 189
    bitmask: 0x100
    entity_category: diagnostic

  - platform: modbus_controller
    modbus_controller_id: "heatpump"
    name: "Status BIT 2 Power Phase"
    id: "heatpump_status_bit_2_power_phase"
    icon: mdi:sine-wave
    register_type: holding
    address: 189
    bitmask: 0x80
    entity_category: diagnostic

text_sensor:
  - platform: template
    name: "Active State"
    id: "heatpump_active_state"
    icon: mdi:power
    entity_category: "diagnostic"
    lambda: |-
      return hp::active_state(id(heatpump_operating_mode).state, id(heatpump_load_output_run).state,
                              id(heatpump_status_bit_1_defrosting).state, id(heatpump_status_bit_1_oil_return).state,
                              id(heatpump_load_output_sv1).state);

  - platform: template
    name: "Current Fault Error Code"
    id: "heatpump_current_fault_error_code"
    icon: "mdi:alert-circle"
    lambda: return hp::fault_code(id(heatpump_current_fault).state);

  - platform: template
    name: "Current Fault Error Code Description"
    id: "heatpump_current_fault_error_code_description"
    icon: "mdi:alert-circle"
    lambda: return hp::fault_description(id(heatpump_current_fault).state);

  - platform: template
    name: "Fault 1 Error Code"
    id: "heatpump_fault_1_error_code"
    icon: "mdi:alert-circle"
    lambda: return hp::fault_code(id(heatpump_fault_1).state);

  - platform: template
    name: "Fault 2 Error Code"
    id: "heatpump_fault_2_error_code"
    icon: "mdi:alert-circle"
    lambda: return hp::fault_code(id(heatpump_fault_2).state);

  - platform: template
    name: "Fault 3 Error Code"
    id: "heatpump_fault_3_error_code"
    icon: "mdi:alert-circle"
    lambda: return hp::fault_code(id(heatpump_fault_3).state);

  - platform: modbus_controller
    modbus_controller_id: "heatpump"
    name: "Operating Mode"
    id: "heatpump_operating_mode"
    icon: mdi:state-machine
    register_type: holding
    address: 101
    response_size: 2
    lambda: |-
      uint16_t raw = (uint16_t(data[item->offset]) << 8) | data[item->offset + 1];
      return hp::operating_mode(raw);

  - platform: modbus_controller
    modbus_controller_id: "heatpump"
    name: "Heat Pump Operation Mode"
    id: "heatpump_heat_pump_operation_mode"
    icon: mdi:heat-pump
    register_type: holding
    address: 199
    lambda: return hp::heat_pump_operation_mode(modbus_controller::word_from_hex_str(x, 0));

  # Reg 187: Modbus protocol version (46 = V4.6).
  - platform: modbus_controller
    modbus_controller_id: "heatpump"
    name: "Modbus Protocol Version"
    id: "heatpump_modbus_protocol_version"
    icon: mdi:protocol
    register_type: holding
    address: 187
    lambda: return hp::protocol_version(modbus_controller::word_from_hex_str(x, 0));

  - platform: modbus_controller
    modbus_controller_id: "heatpump"
    name: "Hydraulic Module Sub-Model"
    id: "heatpump_hydraulic_module_submodel"
    register_type: holding
    address: 190
    lambda: return hp::hydraulic_submodel(modbus_controller::word_from_hex_str(x, 0));

  # Reg 200: product code (read-only).
  - platform: modbus_controller
    modbus_controller_id: "heatpump"
    name: "Home Appliance Product Code"
    id: "heatpump_home_appliance_product_code"
    icon: "mdi:information-box-outline"
    register_type: holding
    response_size: 2
    raw_encode: HEXBYTES
    address: 200
    lambda: |-
      uint16_t raw = (uint16_t(data[item->offset]) << 8) | data[item->offset + 1];
      return std::to_string((raw & 0x00F0) >> 4);
