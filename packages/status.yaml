  - platform: template
    name: "Active State Map"
    id: "heatpump_active_state_map"
    unit_of_measurement: ""
    accuracy_decimals: 0
    lambda: |-
      static const std::map<std::string, int> status_map = {
        {"Inactive", 0},
        {"Heating", 1},
        {"Cooling", 2},
        {"DHW", 3},
        {"Defrosting", 4},
        {"Idle", 5},
        {"Oil return", 6}
      };

      auto state_item = status_map.find(id(heatpump_active_state).state);
      if (state_item != status_map.end()) {
        return state_item->second; // Return integer value that matches the string value (Heating, Cooling, etc..)
      } else {
        return 99; // No mapping found
      }

