  - platform: modbus_controller
    modbus_controller_id: "heatpump"
    name: "Operating Mode"
    id: "heatpump_operating_mode"
    icon: mdi:state-machine
    register_type: holding
    address: 101
    response_size: 2
    lambda: |-
      int idx = item->offset;
      uint16_t rawdata = (uint16_t(data[idx]) << 8) + uint16_t(data[idx + 1]);
      std::string output = "Unknown: ";
      output += to_string(rawdata);
      if (rawdata == 0) output = "OFF";
      else if (rawdata == 2) output = "Cooling";
      else if (rawdata == 3) output = "Heating";
      else if (rawdata == 5) output = "DHW Heating";
      // ESP_LOGD("Register 101","Operating mode %s (%d)", output.c_str(), rawdata);
      return output;

  - platform: modbus_controller
    modbus_controller_id: "heatpump"
    name: "Heat Pump Operation Mode"
    id: "heatpump_heat_pump_operation_mode"
    icon: mdi:heat-pump
    register_type: holding
    address: 199
    lambda: |-
      uint16_t value = modbus_controller::word_from_hex_str(x, 0);
      switch (value) {
        case 0: return std::string("Off");
        case 2: return std::string("Cooling");
        case 3: return std::string("Heating");
        case 5: return std::string("DHW");
        default: return std::string("Invalid");
      }
      return x;

  # Reg 187: Modbus protocol version (46 = V4.6).
  - platform: modbus_controller
    modbus_controller_id: "heatpump"
    name: "Modbus Protocol Version"
    id: "heatpump_modbus_protocol_version"
    icon: mdi:protocol
    register_type: holding
    address: 187
    lambda: |-
      uint16_t value = modbus_controller::word_from_hex_str(x, 0);
      if (value == 0 || value == 0x7FFF) return std::string("Unknown");
      char buf[16];
      snprintf(buf, sizeof(buf), "V%d.%d", value / 10, value % 10);
      return std::string(buf);

