text_sensor:
  - platform: template
    name: "Active State"
    id: "heatpump_active_state"
    icon: mdi:power
    entity_category: "diagnostic"
    lambda: |-
      if (id(heatpump_operating_mode).state != "OFF") {
        if (id(heatpump_load_output_run).state) {
          // The heat pump is on
          if (id(heatpump_status_bit_1_defrosting).state) {
            return {"Defrosting"};
          } else if (id(heatpump_status_bit_1_oil_return).state) {
            return {"Oil return"};
          } else if (id(heatpump_load_output_sv1).state) {
            return {"DHW"};
          } else {
            // Return the state from "Operating Mode", which can be Cooling or Heating
            return id(heatpump_operating_mode).state;
          }
        } else {
          // The heat pumps operating mode is on (not OFF), but is not "Heating", "Cooling", or "DHW".
          // In this case the heat pump is Idle, which is for example the case when it is preparing for a DHW
          // run or between "Heating" sessions
          return {"Idle"};
        }
      } else {
        // The heat pump is off
        return {"Inactive"};
      }

