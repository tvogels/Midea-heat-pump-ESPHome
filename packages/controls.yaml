      return {};

sensor:
  # Reg 0 (power bits), read whole into the shadow global used by the reg 0 switches.
  - platform: modbus_controller
    modbus_controller_id: "heatpump"
    name: "Register 0 switches"
    id: "heatpump_register_0_switches"
    internal: true
    register_type: holding
    address: 0
    value_type: U_WORD
    icon: mdi:eye
    lambda: |-
      // Update the global var unmasked_value_register_0
      id(unmasked_value_register_0) = x;
      id(unmasked_value_register_0_valid) = true;  // Shadow now holds a real value read from the heatpump
      return x;

  # Reg 5 (function settings), read whole into the shadow global used by the reg 5 switches/selects.
  - platform: modbus_controller
    modbus_controller_id: "heatpump"
    name: "Register 5 switches"
    id: "heatpump_register_5_switches"
    internal: true
    register_type: holding
    address: 5
    value_type: U_WORD
    icon: mdi:eye
    lambda: |-
      // Update the global var unmasked_value_register_5
      id(unmasked_value_register_5) = x;
      id(unmasked_value_register_5_valid) = true;  // Shadow now holds a real value read from the heatpump
      return x;

  # Reg 10 bit 1 SG, bit 2 EVU (read-only here).
  - id: "heatpump_special_function_settings"
    platform: modbus_controller
    modbus_controller_id: "heatpump"
    name: "Special Function Settings (SG-EVU)"
    icon: mdi:transmission-tower
    register_type: holding
    address: 10
    value_type: U_WORD

  # Single-purpose control registers 11/15/16/18 (readbacks).
  # V.E notes under reg 21: reg 0 = regs 14-17, reg 2 = regs 11/12, reg 6 = regs 18/19,
  # "recommended to use [these] for control". Verified on this unit 2026-10-25.
  # Each read also arms that register's write guard (regNN_valid).
  # force_new_range: a Modbus exception can only fail its own read.
  - platform: modbus_controller
    modbus_controller_id: "heatpump"
    name: "Set Water Temperature T1S Zone 1 Readback (reg 11)"
    id: "heatpump_reg11_t1s_zone_1"
    icon: mdi:eye-check
    register_type: holding
    address: 11
    value_type: U_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    accuracy_decimals: 0
    force_new_range: true
    entity_category: diagnostic
    lambda: |-
      id(reg11_value) = x;
      id(reg11_valid) = true;  // real read: writes to reg 11 are allowed from now on
      return x;

  - platform: modbus_controller
    modbus_controller_id: "heatpump"
