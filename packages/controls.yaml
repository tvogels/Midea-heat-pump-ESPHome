# Day-to-day controls: power, mode, setpoints, curve selection (regs 0-18).

globals:
  - id: reg0
    type: uint16_t
    restore_value: no
    initial_value: '0'
  - id: reg5
    type: uint16_t
    restore_value: no
    initial_value: '0'
  - id: reg2
    type: uint16_t
    restore_value: no
    initial_value: '0'
  - id: reg6
    type: uint16_t
    restore_value: no
    initial_value: '0'
  - id: reg0_valid
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: reg5_valid
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: reg2_valid
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: reg6_valid
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: reg11
    type: uint16_t
    restore_value: no
    initial_value: '0'
  - id: reg11_valid
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: reg15
    type: uint16_t
    restore_value: no
    initial_value: '0'
  - id: reg15_valid
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: reg16
    type: uint16_t
    restore_value: no
    initial_value: '0'
  - id: reg16_valid
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: reg18
    type: uint16_t
    restore_value: no
    initial_value: '0'
  - id: reg18_valid
    type: bool
    restore_value: no
    initial_value: 'false'

select:
  # Reg 1. V.E: 1 = Auto, 2 = Cool, 3 = Heat.
  - platform: modbus_controller
    modbus_controller_id: "heatpump"
    name: "Operational Mode"
    id: "heatpump_operational_mode"
    icon: "mdi:fan"
    address: 1
    value_type: U_WORD
    optimistic: true
    optionsmap:
      "Heat": 3
      "Cool": 2
      "Auto": 1

  - platform: template
    name: "Silent Mode Level"
    id: "heatpump_silent_mode_level"
    icon: mdi:volume-medium
    entity_category: config
    options:
      - "Level 1"
      - "Level 2"
    lambda: |-
      if ((id(reg5) & 0x80) == 0x80) {
        return {"Level 2"};
      } else {
        return {"Level 1"};
      }
    set_action:
      - lambda: |-
          if (hp::write_packed(heatpump, 5, id(reg5), id(reg5_valid), 0x80, x == "Level 2"))
            id(heatpump_silent_mode_level).publish_state(x);  // show it before the next poll

number:
  # Reg 2 low byte (read). Writes go to single-purpose reg 11.
  # SAFETY: zone 1 is underfloor heating in a cement screed. Max water setpoint 40 °C.
  # Screed degrades above ~45-50 °C, floor coverings above ~35-40 °C. Do not raise
  # without checking floor covering, screed type and EN 1264-2 / NEN 1068 surface limits.
  - platform: modbus_controller
    modbus_controller_id: "heatpump"
    name: "Set Water Temperature T1S Zone 1"
    id: "heatpump_set_water_temperature_t1s_zone_1"
    icon: mdi:temperature-celsius
    register_type: holding
    address: 2
    value_type: U_WORD
    unit_of_measurement: "°C"
    device_class: "temperature"
    entity_category: config
    min_value: 5
    max_value: 40
    mode: slider
    lambda: |-
      hp::capture(id(reg2), id(reg2_valid), x);
      return (uint16_t) x & 0x00FF;  // zone 1
    write_lambda: |-
      hp::write_verified(heatpump, 11, "T1S zone 1", x, id(reg11), id(reg11_valid), id(reg2), id(reg2_valid), 0x00FF);
      return {};

  # Reg 3, raw = °C x2.
  - platform: modbus_controller
    modbus_controller_id: "heatpump"
    name: "Air Temperature Ts"
    id: "heatpump_air_temperature_ts"
    icon: mdi:temperature-celsius
    register_type: holding
    address: 3
    value_type: U_WORD
    unit_of_measurement: "°C"
    entity_category: config
    device_class: temperature
    min_value: 17
    max_value: 30
    step: 0.5
    mode: slider
    lambda: |-
      return x * 0.5;
    write_lambda: |-
      return x * 2.0;

  - platform: modbus_controller
    modbus_controller_id: "heatpump"
    name: "Set DHW Tank Temperature T5s"
    id: "heatpump_set_dhw_tank_temperature_t5s"
    icon: mdi:temperature-celsius
    register_type: holding
    address: 4
    value_type: U_WORD
    unit_of_measurement: "°C"
    device_class: "temperature"
    entity_category: config
    min_value: 20
    max_value: 65
    mode: slider

  # Reg 6 low byte (read). Writes go to single-purpose reg 18.
  - platform: modbus_controller
    modbus_controller_id: "heatpump"
    name: "Weather Compensation Curve Zone 1"
    id: "heatpump_weather_compensation_curve_zone_1"
    icon: mdi:eye
    register_type: holding
    address: 6
    value_type: U_WORD
    entity_category: config
    min_value: 1
    max_value: 9
    mode: slider
    lambda: |-
      hp::capture(id(reg6), id(reg6_valid), x);
      return (uint16_t) x & 0x00FF;  // zone 1
    write_lambda: |-
      hp::write_verified(heatpump, 18, "curve zone 1", x, id(reg18), id(reg18_valid), id(reg6), id(reg6_valid), 0x00FF);
      return {};

switch:
  # Reg 0 bit 0. When on, the wired controller's room sensor decides when the
  # heat pump powers on/off.
  - platform: template
    name: "Room Temperature Control"
    id: "heatpump_room_temperature_control"
    icon: mdi:eye
    entity_category: config
    restore_mode: DISABLED
    optimistic: true
    lambda: "return (id(reg0) & 0x1) == 0x1;"
    on_turn_on:
      - lambda: hp::write_packed(heatpump, 0, id(reg0), id(reg0_valid), 0x1, true);
    on_turn_off:
      - lambda: hp::write_packed(heatpump, 0, id(reg0), id(reg0_valid), 0x1, false);

  # Reg 0 bit 1 (read). Writes go to single-purpose reg 16 (0/1).
  # When on, the zone 1 target water temperature decides when the heat pump powers on/off.
  # The dry-contact room thermostat on this install gates this bit.
  - platform: template
    name: "Water Flow Temperature Control Zone 1"
    id: "heatpump_water_flow_temperature_control_zone_1"
    icon: mdi:eye
    entity_category: config
    restore_mode: DISABLED
    optimistic: true
    lambda: "return (id(reg0) & 0x2) == 0x2; // Return bit 0x2 status"
    on_turn_on:
      - lambda: hp::write_verified(heatpump, 16, "power zone 1", 1, id(reg16), id(reg16_valid), id(reg0), id(reg0_valid), 0x2);
    on_turn_off:
      - lambda: hp::write_verified(heatpump, 16, "power zone 1", 0, id(reg16), id(reg16_valid), id(reg0), id(reg0_valid), 0x2);

  # Reg 0 bit 2 (read). Writes go to single-purpose reg 15 (0/1).
  - platform: template
    name: "Power DHW T5S"
    id: "heatpump_power_dhw_t5s"
    icon: mdi:eye
    entity_category: config
    restore_mode: DISABLED
    optimistic: true
    lambda: |-
      return (id(reg0) & 0x4) == 0x4;
    on_turn_on:
      - lambda: hp::write_verified(heatpump, 15, "power DHW", 1, id(reg15), id(reg15_valid), id(reg0), id(reg0_valid), 0x4);
    on_turn_off:
      - lambda: hp::write_verified(heatpump, 15, "power DHW", 0, id(reg15), id(reg15_valid), id(reg0), id(reg0_valid), 0x4);

  - platform: template
    name: "Disinfect"
    id: "heatpump_disinfect"
    icon: mdi:eye
    entity_category: config
    restore_mode: DISABLED
    optimistic: true
    lambda: "return (id(reg5) & 0x10) == 0x10; // Return status bit 4"
    on_turn_on:
      - lambda: hp::write_packed(heatpump, 5, id(reg5), id(reg5_valid), 0x10, true);
    on_turn_off:
      - lambda: hp::write_packed(heatpump, 5, id(reg5), id(reg5_valid), 0x10, false);

  - platform: template
    name: "Silent Mode"
    id: "heatpump_silent_mode"
    icon: mdi:volume-low
    entity_category: config
    restore_mode: DISABLED
    optimistic: true
    lambda: "return (id(reg5) & 0x40) == 0x40;"
    on_turn_on:
      - lambda: hp::write_packed(heatpump, 5, id(reg5), id(reg5_valid), 0x40, true);
    on_turn_off:
      - lambda: hp::write_packed(heatpump, 5, id(reg5), id(reg5_valid), 0x40, false);

  # Reg 5 bit 8. V.E marks this bit read-only.
  - platform: template
    name: "Holiday Home"
    id: "heatpump_holiday_home"
    icon: mdi:eye
    entity_category: config
    restore_mode: DISABLED
    optimistic: true
    lambda: "return (id(reg5) & 0x100) == 0x100;"
    on_turn_on:
      - lambda: hp::write_packed(heatpump, 5, id(reg5), id(reg5_valid), 0x100, true);
    on_turn_off:
      - lambda: hp::write_packed(heatpump, 5, id(reg5), id(reg5_valid), 0x100, false);

  - platform: template
    name: "ECO Mode"
    id: "heatpump_eco_mode"
    icon: mdi:eye
    entity_category: config
    restore_mode: DISABLED
    optimistic: true
    lambda: "return (id(reg5) & 0x400) == 0x400;"
    on_turn_on:
      - lambda: hp::write_packed(heatpump, 5, id(reg5), id(reg5_valid), 0x400, true);
    on_turn_off:
      - lambda: hp::write_packed(heatpump, 5, id(reg5), id(reg5_valid), 0x400, false);

  # Reg 5 bit 12: zone 1 climate curve on/off. No single-purpose register.
  - platform: template
    name: "Weather Compensation Zone 1"
    id: "heatpump_weather_compensation_zone_1"
    icon: mdi:eye
    entity_category: config
    restore_mode: DISABLED
    optimistic: true
    lambda: "return (id(reg5) & 0x1000) == 0x1000;"
    on_turn_on:
      - lambda: hp::write_packed(heatpump, 5, id(reg5), id(reg5_valid), 0x1000, true);
    on_turn_off:
      - lambda: hp::write_packed(heatpump, 5, id(reg5), id(reg5_valid), 0x1000, false);

  # Reg 7.
  - platform: modbus_controller
    modbus_controller_id: "heatpump"
    name: "Forced Water Tank Heating"
    id: "heatpump_forced_water_tank_heating"
    icon: mdi:fire-alert
    address: 7
    register_type: holding
    entity_category: config
    write_lambda: |-
      // V.E: 1 = start, 2 = stop.
      heatpump->queue_command(esphome::modbus_controller::ModbusCommandItem::create_write_single_command(
          heatpump, 7, x ? 1 : 2));
      return {};

sensor:
  # Reg 0 (power bits), read whole into the shadow global used by the reg 0 switches.
  - platform: modbus_controller
    modbus_controller_id: "heatpump"
    name: "Register 0 switches"
    id: "heatpump_register_0_switches"
    internal: true
    register_type: holding
    address: 0
    value_type: U_WORD
    icon: mdi:eye
    lambda: return hp::capture(id(reg0), id(reg0_valid), x);

  # Reg 5 (function settings), read whole into the shadow global used by the reg 5 switches/selects.
  - platform: modbus_controller
    modbus_controller_id: "heatpump"
    name: "Register 5 switches"
    id: "heatpump_register_5_switches"
    internal: true
    register_type: holding
    address: 5
    value_type: U_WORD
    icon: mdi:eye
    lambda: return hp::capture(id(reg5), id(reg5_valid), x);

  # Reg 10 bit 1 SG, bit 2 EVU (read-only here).
  - id: "heatpump_special_function_settings"
    platform: modbus_controller
    modbus_controller_id: "heatpump"
    name: "Special Function Settings (SG-EVU)"
    icon: mdi:transmission-tower
    register_type: holding
    address: 10
    value_type: U_WORD

  # Single-purpose control registers 11/15/16/18 (readbacks).
  # V.E notes under reg 21: reg 0 = regs 14-17, reg 2 = regs 11/12, reg 6 = regs 18/19,
  # "recommended to use [these] for control". Verified on this unit 2026-10-25.
  # Each read also arms that register's write guard (regNN_valid).
  # force_new_range: a Modbus exception can only fail its own read.
  - platform: modbus_controller
    modbus_controller_id: "heatpump"
    name: "Set Water Temperature T1S Zone 1 Readback (reg 11)"
    id: "heatpump_reg11_t1s_zone_1"
    icon: mdi:eye-check
    register_type: holding
    address: 11
    value_type: U_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    accuracy_decimals: 0
    force_new_range: true
    entity_category: diagnostic
    lambda: return hp::capture(id(reg11), id(reg11_valid), x);

  - platform: modbus_controller
    modbus_controller_id: "heatpump"
    name: "Power DHW T5S Readback (reg 15)"
    id: "heatpump_reg15_power_dhw"
    icon: mdi:eye-check
    register_type: holding
    address: 15
    value_type: U_WORD
    accuracy_decimals: 0
    force_new_range: true
    entity_category: diagnostic
    lambda: return hp::capture(id(reg15), id(reg15_valid), x);

  - platform: modbus_controller
    modbus_controller_id: "heatpump"
    name: "Water Flow Temperature Control Zone 1 Readback (reg 16)"
    id: "heatpump_reg16_power_zone_1"
    icon: mdi:eye-check
    register_type: holding
    address: 16
    value_type: U_WORD
    accuracy_decimals: 0
    force_new_range: true
    entity_category: diagnostic
    lambda: return hp::capture(id(reg16), id(reg16_valid), x);

  - platform: modbus_controller
    modbus_controller_id: "heatpump"
    name: "Weather Compensation Curve Zone 1 Readback (reg 18)"
    id: "heatpump_reg18_curve_selection_zone_1"
    icon: mdi:eye-check
    register_type: holding
    address: 18
    value_type: U_WORD
    accuracy_decimals: 0
    force_new_range: true
    entity_category: diagnostic
    lambda: return hp::capture(id(reg18), id(reg18_valid), x);

binary_sensor:
  - id: "heatpump_function_setting_refrigerant_leakage_detection"
    platform: template
    name: "Function Setting Refrigerant Leakage Detection"
    icon: mdi:eye
    lambda: "return (id(reg5) & 0x01) == 0x01; // Return status bit0"

  - platform: template
    name: "Holiday Away"
    id: "heatpump_holiday_away"
    icon: mdi:eye
    lambda: "return (id(reg5) & 0x20) == 0x20; // Return status bit5"

  - id: "heatpump_function_setting_c2_fault_restore"
    platform: template
    name: "Function Setting C2 Fault Restore"
    icon: mdi:eye
    lambda: "return (id(reg5) & 0x4000) == 0x4000; // Return status bit14"
