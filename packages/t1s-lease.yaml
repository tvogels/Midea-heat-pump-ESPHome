# Supervised T1S lease (opt-in): lets an external supervisor (Homage) set the
# zone 1 water target directly for a limited time. If it stops renewing the
# lease, the ESP restores the original settings itself.
# Enable it by uncommenting the t1s-lease line in heatpump.yaml.
# Adds:
#   * native API actions set_supervised_t1s / renew_lease / release_supervision
#   * status entities
#   * a 1 s interval driving the lease state machine (include/t1s_lease.h)
# See docs/t1s-lease.md for the contract.
#
# api.reboot_timeout is left at the ESPHome default (15 min): the ESP reboots
# if no API client is connected for 15 min. That is harmless for this feature
# (a reboot mid-lease triggers a restore from the persisted snapshot), but
# when Homage becomes the only API client you will likely want
# `reboot_timeout: 0s` so the ESP does not reboot whenever Homage is offline.
# Not changed here on purpose.

substitutions:
  # Minimum interval between mid-lease T1S (reg 11) writes to the heat pump.
  # Each write is one heat-pump EEPROM write. 900 s = max 4/h = 96/day
  # (~35k/year); a planner needing ~2 T1S changes per hour uses ~48/day
  # (~17.5k/year). The latest target is always the one written.
  t1s_min_write_interval_s: "900"

esphome:
  includes:
    - include/t1s_lease.h
  on_boot:
    # After the modbus_controller (setup_priority -10) is set up.
    - priority: -100
      then:
        - lambda: |-
            t1s_lease::instance().setup(id(heatpump),
                                        &id(reg0),  // observed only (DHW bit)
                                        &id(reg2),  // reg 2 shadow: observed (drift), low byte synced from reg 11 reads
                                        &id(reg5),
                                        &id(reg2_valid),
                                        &id(reg5_valid),
                                        ${t1s_min_write_interval_s});

api:
  actions:
    - action: set_supervised_t1s
      variables:
        t1s: int
        lease_s: int
      then:
        - lambda: |-
            t1s_lease::instance().set_supervised(
                t1s, lease_s,
                id(heatpump_temperature_lower_limit_of_t1s_heating_zone_1).state,
                id(heatpump_temperature_upper_limit_of_t1s_heating_zone_1).state);
    - action: renew_lease
      variables:
        lease_s: int
      then:
        - lambda: "t1s_lease::instance().renew(lease_s);"
    - action: release_supervision
      then:
        - lambda: "t1s_lease::instance().release();"

interval:
  - interval: 1s
    then:
      - lambda: |-
          auto &l = t1s_lease::instance();
          l.loop();
          // Publish status on transitions, not only on the poll interval.
          if (l.consume_changed()) {
            id(heatpump_t1s_supervision_active).publish_state(l.active());
            id(heatpump_t1s_lease_remaining).publish_state(l.lease_remaining_s());
            id(heatpump_t1s_restore_count).publish_state(l.restore_count());
            id(heatpump_t1s_hp_write_count).publish_state(l.write_count());
            id(heatpump_t1s_dhw_drop_count).publish_state(l.dhw_drop_count());
            id(heatpump_t1s_drift_count).publish_state(l.drift_count());
            id(heatpump_t1s_last_error).publish_state(l.last_error());
            id(heatpump_t1s_mode).publish_state(l.mode_name());
          }

binary_sensor:
  - platform: template
    name: "T1S Supervision Active"
    id: "heatpump_t1s_supervision_active"
    icon: mdi:shield-account
    lambda: "return t1s_lease::instance().active();"

sensor:
  - platform: template
    name: "T1S Lease Remaining"
    id: "heatpump_t1s_lease_remaining"
    unit_of_measurement: s
    accuracy_decimals: 0
    update_interval: 10s
    lambda: "return t1s_lease::instance().lease_remaining_s();"
  - platform: template
    name: "T1S Supervision Restore Count"
    id: "heatpump_t1s_restore_count"
    accuracy_decimals: 0
    state_class: total_increasing  # since boot (resets on reboot)
    update_interval: 60s
    lambda: "return t1s_lease::instance().restore_count();"
  - platform: template
    name: "T1S Heat Pump Write Count"
    id: "heatpump_t1s_hp_write_count"
    icon: mdi:chip
    accuracy_decimals: 0
    state_class: total_increasing  # reg 11/5 writes by the lease since boot
    update_interval: 60s
    lambda: "return t1s_lease::instance().write_count();"
  - platform: template
    name: "T1S DHW Drops After Lease Write"
    id: "heatpump_t1s_dhw_drop_count"
    icon: mdi:water-boiler-alert
    accuracy_decimals: 0
    state_class: total_increasing
    update_interval: 60s
    lambda: "return t1s_lease::instance().dhw_drop_count();"
  - platform: template
    name: "T1S External Change Count"
    id: "heatpump_t1s_drift_count"
    icon: mdi:account-switch
    accuracy_decimals: 0
    state_class: total_increasing
    update_interval: 60s
    lambda: "return t1s_lease::instance().drift_count();"

text_sensor:
  - platform: template
    name: "T1S Supervision Last Error"
    id: "heatpump_t1s_last_error"
    icon: mdi:alert
    update_interval: 10s
    lambda: "return t1s_lease::instance().last_error();"
  - platform: template
    name: "T1S Supervision Mode"
    id: "heatpump_t1s_mode"
    icon: mdi:state-machine
    update_interval: 10s
    lambda: "return {t1s_lease::instance().mode_name()};"
